// This adapter only schedules portable preparation; port details live in CMake.
def aapJuceDirectory = file(providers.environmentVariable('AAP_JUCE_DIR')
        .getOrElse("${rootProject.projectDir}/external/aap-juce"))
def coreDirectory = file(providers.environmentVariable('AAP_DIR')
        .getOrElse("${rootProject.projectDir}/external/aap-core"))
def portConfiguration = rootProject.file(providers.gradleProperty('aapJucePortConfig')
        .getOrElse('aap-port.cmake'))
def sdkDirectory = androidComponents.sdkComponents.sdkDirectory.get().asFile
def executableName = System.getProperty('os.name').toLowerCase().contains('windows') ? 'cmake.exe' : 'cmake'
def sdkCmake = new File(sdkDirectory, "cmake/${libs.versions.cmake.get()}/bin/${executableName}")
def cmakeExecutable = providers.gradleProperty('aapJuceCmake')
        .getOrElse(sdkCmake.isFile() ? sdkCmake.absolutePath : executableName)

def prepareAapJuce = tasks.register('prepareAapJuce', Exec) {
    group = 'build'
    description = 'Prepare application and JUCE sources once across native ABIs.'
    commandLine cmakeExecutable,
            "-DPORT_CONFIG=${portConfiguration.absolutePath}",
            "-DAAP_JUCE_DIR=${aapJuceDirectory.absolutePath}",
            "-DAAP_DIR=${coreDirectory.absolutePath}",
            '-P', new File(aapJuceDirectory, 'cmake/PreparePort.cmake').absolutePath
    // Always validate the CMake journal, including after a source checkout/reset.
    // CMake skips the actual preparation when its fingerprint and files match.
}

tasks.configureEach {
    if (name == 'preBuild' || name.startsWith('configureCMake') ||
            name.startsWith('buildCMake') ||
            (name.startsWith('externalNativeBuild') && !name.startsWith('externalNativeBuildClean')) ||
            name.startsWith('lint') ||
            name.matches('compile.*JavaWithJavac') || name.matches('compile.*Kotlin') ||
            name.matches('merge.*Resources') || name.matches('merge.*Assets')) {
        dependsOn prepareAapJuce
    }
}
